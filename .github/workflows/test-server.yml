name: test-server
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: run /keepalive through the HTTP wrapper
        env:
          PORT: "8080"
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
          INSTABOX_PUBLIC_URL: ${{ secrets.INSTABOX_PUBLIC_URL }}
          INSTABOX_LEASE_TTL: "3600"
        run: |
          python3 server.py > /tmp/srv.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/nope || break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 http://127.0.0.1:8080/keepalive)
          echo "keepalive -> HTTP $code"
          cat /tmp/srv.log
          test "$code" = "200"
