name: debug-ports
on: workflow_dispatch
permissions: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dump public ports and machine list
        env:
          K: ${{ secrets.INSTABOX_API_KEY }}
          M: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          echo "== ports of \$M =="
          curl -sS -H "Authorization: Bearer $K" "https://api.instabox.sh/v1/machines/$M/ports" | jq -c .
          echo "== connection-info =="
          curl -sS -H "Authorization: Bearer $K" "https://api.instabox.sh/v1/machines/$M/connection-info" | jq -c .
          echo "== all machines =="
          curl -sS -H "Authorization: Bearer $K" "https://api.instabox.sh/v1/machines" | jq -c '.machines[]? | {id,name,state}'
