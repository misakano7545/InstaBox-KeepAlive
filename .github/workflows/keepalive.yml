name: keepalive

on:
  # schedule 由 GitHub 排队 5 小时以上才触发，在这个账号上不可用，先关掉
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: renew lease / probe / recover
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
          INSTABOX_PUBLIC_URL: ${{ secrets.INSTABOX_PUBLIC_URL }}
          INSTABOX_RESTART_CMD: ${{ secrets.INSTABOX_RESTART_CMD }}
          # 定时任务可能延迟，TTL 取满 1 小时，避免两次运行之间 lease 先过期
          INSTABOX_LEASE_TTL: "3600"
        run: python3 instabox_keepalive.py
